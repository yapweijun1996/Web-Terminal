set-option -g mouse on
# Publish the pane actually displayed by this tmux client with each title update.
# The browser strips this prefix before showing the title; missing metadata fails closed.
set-option -g set-titles on
set-option -g set-titles-string '__WEB_TERMINAL_TARGET__|#{session_name}|#{session_id}|#{pane_id}|#{pid}|#{pane_title}'
set-option -g status-position top
set-option -g status-style 'bg=#17212c,fg=#d7e2ef'
set-option -g status-left ''
set-option -g status-left-length 12
set-option -g status-right ''
set-option -g status-right-length 20
set-window-option -g window-status-format '  #I: #W  '
set-window-option -g window-status-current-format '#[fg=#182434,bg=#a7c7e7,bold]  #I: #W  '

# Scroll on the first wheel event while preserving mouse-aware applications.
bind-key -n WheelUpPane if-shell -F '#{||:#{alternate_on},#{pane_in_mode},#{mouse_any_flag}}' 'send-keys -M' 'copy-mode -e ; send-keys -X -N 5 scroll-up'
