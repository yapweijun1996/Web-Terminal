<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Windows Terminal</title>
  <link rel="stylesheet" href="/vendor/xterm.css">
  <link rel="stylesheet" href="/style.css">
  <script defer src="/vendor/xterm.js"></script>
  <script defer src="/vendor/addon-fit.js"></script>
  <script defer src="/app.js"></script>
</head>
<body>
  <header>
    <strong>PowerShell</strong><span id="connection" role="status" aria-live="polite">Loading</span>
    <div class="actions"><button id="new">New terminal</button><button id="all">All terminals</button><button id="retry">Reconnect</button><button id="end" class="danger">End session</button></div>
  </header>
  <nav id="tabs" aria-label="Terminal tabs"></nav>
  <main id="workspace" aria-label="PowerShell terminal"></main>
  <p id="empty" hidden>No terminal is visible. Open All terminals or create a new one.</p>
  <footer>Windows · Closing a view keeps its shell running. Host sleep, logout or service restart interrupts access.</footer>
  <dialog id="chooser"><h2>All terminals</h2><div id="session-list"></div><button id="dismiss">Done</button></dialog>
</body>
</html>
