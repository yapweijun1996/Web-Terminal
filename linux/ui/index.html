<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linux Terminal</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <strong>Terminal</strong>
    <nav id="tabs" aria-label="Terminal tabs"></nav>
    <button id="new-tab" type="button" title="New terminal" aria-label="New terminal">+</button>
    <button id="rename-tab" type="button">Rename</button>
    <button id="latest" type="button" title="Return to the latest output">Latest</button>
    <button id="copy-selection" type="button" hidden>Copy selection</button>
    <button id="restore" type="button" hidden>Restore tabs</button>
    <div class="connection">
      <span id="status" role="status" aria-live="polite" tabindex="-1"></span>
      <button id="retry" type="button" hidden>Retry</button>
    </div>
  </header>
  <form id="rename-form" hidden>
    <label for="rename-input">View name</label>
    <input id="rename-input" type="text" maxlength="40" autocomplete="off">
    <button type="submit">Save name</button>
    <button id="rename-cancel" type="button">Cancel</button>
    <span id="rename-error" role="alert"></span>
    <small>Names are stored in this browser. Hiding a view keeps its session running.</small>
  </form>
  <div id="image-notice" role="status" aria-live="polite" hidden></div>
  <section id="image-results" aria-label="Saved image paths"></section>
  <main id="views"></main>
</body>
</html>
