<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Linux Terminal</title>
  <link rel="stylesheet" href="/style.css">
  <script src="/app.js" defer></script>
</head>
<body>
  <header>
    <strong>Terminal</strong>
    <nav id="tabs" aria-label="Terminal tabs"></nav>
    <button id="new-tab" type="button" title="New terminal" aria-label="New terminal">+</button>
    <button id="latest" type="button" title="Return to the latest output">Latest</button>
    <button id="restore" type="button" hidden>Restore tabs</button>
    <span id="status" role="status"></span>
  </header>
  <main id="views"></main>
</body>
</html>
