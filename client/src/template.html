<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <title><%= htmlWebpackPlugin.options.title %></title>
    <link inline rel="icon" type="image/png" href="favicon.png">
    <% for (const css in htmlWebpackPlugin.files.css) { %>
    <link inline rel="stylesheet" type="text/css" href="<%= htmlWebpackPlugin.files.css[css] %>">
    <% } %>
</head>
<body>
<script inline src="connection-lifecycle.js"></script>
<script inline src="touch-scroll.js"></script>
<% for (const js in htmlWebpackPlugin.files.js) { %>
<script inline type="text/javascript" src="<%= htmlWebpackPlugin.files.js[js] %>"></script>
<% } %>
<link inline rel="stylesheet" href="tokens.css">
<link inline rel="stylesheet" href="toolbar.css">
<link inline rel="stylesheet" href="mobile-keys.css">
<script inline src="mobile-keys.js"></script>
<link inline rel="stylesheet" href="display-controls.css">
<script inline src="display-controls.js"></script>
<script inline src="status-model.js"></script>
<script inline src="toolbar.js"></script>
<script inline src="window-tabs.js"></script>
<link inline rel="stylesheet" href="upload.css">
<script inline src="upload.js"></script>
</body>
</html>
